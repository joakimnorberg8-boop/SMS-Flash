<title>SMS Flashcards</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#15171a;--muted:#6d737c;--line:#e4e7eb;--accent:#4f46e5;--good:#16794b;--mid:#b26a00;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{max-width:1180px;margin:auto;padding:42px 24px 18px} h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.055em;margin:0} .sub{color:var(--muted);font-size:17px;margin-top:8px}
.toolbar{max-width:1180px;margin:auto;padding:12px 24px 20px;display:grid;grid-template-columns:1.5fr repeat(2,minmax(150px,.5fr));gap:10px}
input,select,button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px} button{cursor:pointer;font-weight:650} button:hover{border-color:#b8bec8}
.stats{max-width:1180px;margin:auto;padding:0 24px 18px;display:flex;gap:10px;flex-wrap:wrap} .pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:14px}
main{max-width:1180px;margin:auto;padding:0 24px 60px}
.study{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.cardWrap{perspective:1200px;min-height:470px} .card{position:relative;min-height:470px;transform-style:preserve-3d;transition:.45s;cursor:pointer} .card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:38px;box-shadow:0 18px 50px rgba(25,30,40,.07);display:flex;flex-direction:column}
.back{transform:rotateY(180deg)} .tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800} .term{font-size:clamp(34px,5vw,60px);letter-spacing:-.045em;line-height:1.02;margin:auto 0}
.hint{color:var(--muted);margin-top:auto} .def{font-size:22px;line-height:1.55;margin:22px 0} .example{margin-top:auto;background:#f7f7fa;border-radius:18px;padding:18px;line-height:1.5} .example b{display:block;margin-bottom:6px}
.side{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;position:sticky;top:14px} .side h3{margin:2px 0 12px} .controls{display:grid;gap:9px} .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px} .grade button{padding:11px 6px;font-size:13px} .g{color:var(--good)}.m{color:var(--mid)}.b{color:var(--bad)}
.progress{height:8px;background:#eceef1;border-radius:99px;overflow:hidden;margin:14px 0} .bar{height:100%;background:var(--accent);width:0}
.list{margin-top:28px} .list h2{font-size:26px;letter-spacing:-.03em} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .mini{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer} .mini:hover{transform:translateY(-1px)} .mini small{color:var(--muted)} .mini strong{display:block;margin-top:5px}
@media(max-width:800px){.toolbar{grid-template-columns:1fr}.study{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.face{padding:26px}.cardWrap,.card{min-height:500px}}
</style>
</head>
<body>
<header><h1>SMS Flashcards</h1><div class="sub">Stress · Motivasjon · Selvledelse — begrepp, teorier, strategier och konkreta exempel</div></header>
<div class="toolbar">
<input id="search" placeholder="Sök begrepp eller teori…">
<select id="module"><option value="">Alla moduler</option><option>Selvledelse</option><option>Motivasjon</option><option>Stress</option></select>
<select id="type"><option value="">Alla typer</option></select>
</div>
<div class="stats"><span class="pill" id="count"></span><span class="pill" id="known"></span><span class="pill" id="uncertain"></span><span class="pill" id="unknown"></span></div>
<main>
<section class="study">
<div class="cardWrap"><div class="card" id="card">
<div class="face front"><div class="tag" id="frontTag"></div><div class="term" id="term"></div><div class="hint">Klicka på kortet för att visa förklaring + exempel</div></div>
<div class="face back"><div class="tag" id="backTag"></div><div class="def" id="definition"></div><div class="example"><b>Exempel</b><span id="example"></span></div></div>
</div></div>
<aside class="side">
<h3>Träna aktivt</h3><div id="position"></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls"><button id="flip">Vänd kort</button><button id="next">Nästa →</button><button id="shuffle">Blanda korten</button></div>
<div class="grade"><button class="g" data-grade="known">✓ Kan</button><button class="m" data-grade="uncertain">~ Osäker</button><button class="b" data-grade="unknown">× Kan inte</button></div>
<p style="color:var(--muted);font-size:13px;line-height:1.5">Din markering sparas lokalt i webbläsaren. Filtrera sedan på det du behöver nöta mer.</p>
<select id="status" style="width:100%"><option value="">Alla kunskapsnivåer</option><option value="known">Kan</option><option value="uncertain">Osäker</option><option value="unknown">Kan inte</option><option value="unrated">Ej testad</option></select>
</aside>
</section>
<section class="list"><h2>Alla kort</h2><div class="grid" id="grid"></div></section>
</main>
<script>
const all=[{"term": "Psykososialt arbeidsmiljø", "module": "Selvledelse", "type": "Begrepp", "definition": "Psykologiska och sociala faktorer i arbetet som påverkar trivsel och hälsa. Det kan handla om autonomi, kontroll, relationer, organisering och hur arbetsmiljön upplevs.", "example": "En anställd kan ha ett fint kontor men ändå uppleva dålig arbetsmiljö om hen saknar kontroll och stöd från kollegor."}, {"term": "Motivasjonspsykologisk perspektiv", "module": "Selvledelse", "type": "Perspektiv", "definition": "Fokuserar på positiva sidor och resurser i arbetet, exempelvis autonomi, stöd och mening, som kan skapa motivation och utveckling.", "example": "En chef ger medarbetaren frihet att välja hur en uppgift ska lösas och ger stöd när det behövs."}, {"term": "Stressretorisk perspektiv", "module": "Selvledelse", "type": "Perspektiv", "definition": "Fokuserar på belastningar och krav i arbetsmiljön, exempelvis tidspress, konflikter och brist på stöd.", "example": "En medarbetare har ständiga deadlines men liten kontroll över hur arbetet ska utföras."}, {"term": "Taylorisme / Scientific Management", "module": "Selvledelse", "type": "Teori", "definition": "Frederick W. Taylors syn på arbete: arbetet delas upp i små standardiserade uppgifter. Ledningen planerar och bestämmer, medan arbetaren främst utför. Kan öka effektivitet men minska autonomi, variation och kreativitet.", "example": "På ett lager bestämmer ledningen exakt i vilken ordning varje moment ska göras och hur lång tid det får ta."}, {"term": "Hawthorne-eksperimentene", "module": "Selvledelse", "type": "Teori", "definition": "Studier där man bland annat ändrade belysning, pauser och arbetstid. Produktiviteten ökade trots olika förändringar. Uppmärksamhet, observation och känslan av tillhörighet blev viktiga förklaringar.", "example": "En grupp får extra uppmärksamhet från ledningen under ett projekt och börjar prestera bättre."}, {"term": "Hawthorne-effekten", "module": "Selvledelse", "type": "Begrepp", "definition": "Att människors beteende eller prestation kan förändras när de vet att de observeras eller får särskild uppmärksamhet.", "example": "En anställd arbetar extra noggrant när chefen sitter bredvid och följer arbetet."}, {"term": "Prokrastinering", "module": "Selvledelse", "type": "Begrepp", "definition": "Onödig uppskjutning av något trots att man vet att uppskjutningen kan få negativa konsekvenser.", "example": "Du vet att tentan är på fredag men scrollar TikTok hela måndagen och måste panikplugga senare."}, {"term": "Strategisk utsettelse", "module": "Selvledelse", "type": "Begrepp", "definition": "En medveten och planerad uppskjutning eftersom det finns en god anledning att göra uppgiften senare.", "example": "Du väntar med en uppgift tills efter nästa föreläsning eftersom viktig information kommer där."}, {"term": "Differensialpsykologisk perspektiv", "module": "Selvledelse", "type": "Perspektiv", "definition": "Förklarar prokrastinering utifrån relativt stabila individuella skillnader, exempelvis personlighet.", "example": "Två studenter har samma uppgift men den ena har mycket större tendens att skjuta upp arbete."}, {"term": "Motivasjonspsykologisk perspektiv på prokrastinering", "module": "Selvledelse", "type": "Perspektiv", "definition": "Förklarar prokrastinering genom ett gap mellan intention och handling, där motivationen inte räcker för att faktiskt börja eller fortsätta.", "example": "Du vill plugga men uppgiften känns så lite motiverande att du aldrig kommer igång."}, {"term": "Klinisk-psykologisk perspektiv", "module": "Selvledelse", "type": "Perspektiv", "definition": "Förklarar prokrastinering i relation till kliniska eller psykiska svårigheter som kan påverka reglering och genomförande.", "example": "Svårigheter med uppmärksamhet och reglering kan göra det svårare att starta och avsluta uppgifter."}, {"term": "Situasjonspsykologisk perspektiv", "module": "Selvledelse", "type": "Perspektiv", "definition": "Förklarar prokrastinering utifrån situationen eller själva uppgiften.", "example": "En oklar, stor och tråkig uppgift skjuts lättare upp än en tydlig och intressant uppgift."}, {"term": "Selvledelse", "module": "Selvledelse", "type": "Begrepp", "definition": "Att påverka sina egna tankar, känslor och handlingar för att uppnå resultat och egna mål.", "example": "En student planerar sin läsning, följer upp vad som fungerar och ändrar strategi inför examen."}, {"term": "Atferdsfokuserte strategier", "module": "Selvledelse", "type": "Strategi", "definition": "Självledningsstrategier som riktar sig mot det man faktiskt gör. Hit hör bland annat självobservation, målsättning, träning/lärande och självbelöning.", "example": "Du registrerar hur mycket du pluggar varje dag och sätter ett konkret mål för nästa vecka."}, {"term": "Selvobservasjon", "module": "Selvledelse", "type": "Strategi", "definition": "Att systematiskt samla information om sitt eget beteende för att förstå när, var och varför man agerar som man gör.", "example": "Du skriver ner varje gång du tar upp mobilen under en pluggperiod för att hitta dina distraktioner."}, {"term": "Målsetting", "module": "Selvledelse", "type": "Strategi", "definition": "Att sätta konkreta, utmanande och mätbara mål som styr beteendet.", "example": "I stället för 'plugga mer' sätter du målet att kunna 20 begrepp före klockan 18."}, {"term": "Observasjonslæring – Bandura", "module": "Selvledelse", "type": "Teori", "definition": "Lärande genom att observera hur andra utför ett beteende och vilka konsekvenser beteendet får.", "example": "En ny bartender lär sig en effektiv arbetsrutin genom att observera en erfaren kollega."}, {"term": "Kolbs læringssirkel", "module": "Selvledelse", "type": "Teori", "definition": "Lärande som en cykel: erfarenhet → reflektion → begreppsbildning → testning av det man lärt sig.", "example": "Efter en presentation reflekterar du över vad som gick fel, formulerar en ny strategi och testar den nästa gång."}, {"term": "Naturlig belønnende strategier", "module": "Selvledelse", "type": "Strategi", "definition": "Strategier som gör själva uppgiften mer intressant, meningsfull eller behaglig och därmed stärker inre motivation.", "example": "Du gör pluggandet mer motiverande genom att koppla teorin till situationer från ditt eget arbetsliv."}, {"term": "Oppgaveorienterte naturlige belønninger", "module": "Selvledelse", "type": "Strategi", "definition": "Att förändra eller fokusera på delar av själva uppgiften som upplevs som mer givande.", "example": "Du börjar med den del av en rapport som du tycker är mest intressant för att komma in i arbetet."}, {"term": "Relasjonsorienterte naturlige belønninger", "module": "Selvledelse", "type": "Strategi", "definition": "Att använda sociala relationer för att göra arbetet mer givande.", "example": "Du pluggar tillsammans med en vän och diskuterar teorierna i stället för att bara läsa ensam."}, {"term": "Oppmerksomhetsorienterte naturlige belønninger", "module": "Selvledelse", "type": "Strategi", "definition": "Att rikta uppmärksamheten mot positiva eller meningsfulla aspekter av en uppgift.", "example": "Under en tråkig arbetsuppgift fokuserar du på vad du faktiskt lär dig av den."}, {"term": "Kognitive strategier", "module": "Selvledelse", "type": "Strategi", "definition": "Strategier som förändrar hur vi tänker om oss själva och situationer. Exempel är konstruktivt självsnack, visualisering och att utmana negativa antaganden.", "example": "Inför en presentation ersätter du 'jag kommer misslyckas' med ett mer realistiskt tankesätt och visualiserar genomförandet."}, {"term": "Visualisering", "module": "Selvledelse", "type": "Strategi", "definition": "Att mentalt föreställa sig hur man genomför en situation eller lyckas med en uppgift.", "example": "Du ser framför dig hur du lugnt svarar på en examensfråga innan du börjar skriva."}, {"term": "ABCDE-modellen", "module": "Selvledelse", "type": "Teori", "definition": "A = aktiverande händelse, B = belief/tolkning, C = konsekvens, D = disputera/utmana tanken, E = effekt av den nya tolkningen. Modellen visar hur tankar påverkar reaktioner.", "example": "A: du får kritik. B: 'jag är värdelös'. C: stress. D: du utmanar tanken. E: kritiken blir information du kan använda."}, {"term": "Superledelse", "module": "Selvledelse", "type": "Teori", "definition": "Att leda andra till att bli bättre på att leda sig själva. Ledaren modellerar självledelse, uppmuntrar egna mål, lärande, positiva tankemönster och ansvar.", "example": "Chefen ger inte bara färdiga svar utan ställer frågor så att medarbetaren själv hittar lösningen."}, {"term": "Motivasjon", "module": "Motivasjon", "type": "Begrepp", "definition": "Processer som sätter igång, riktar och upprätthåller beteende samt påverkar hur mycket kraft vi lägger ner.", "example": "Två personer kan ha samma uppgift men arbeta olika länge och intensivt beroende på motivation."}, {"term": "Indre motivasjon", "module": "Motivasjon", "type": "Begrepp", "definition": "Motivation där aktiviteten i sig upplevs som intressant, rolig eller meningsfull.", "example": "Du läser organisationspsykologi eftersom du genuint tycker att ämnet är intressant."}, {"term": "Ytre motivasjon", "module": "Motivasjon", "type": "Begrepp", "definition": "Motivation som drivs av konsekvenser utanför själva aktiviteten, exempelvis lön, bonus eller sanktioner.", "example": "En säljare arbetar extra hårt för att få en individuell bonus."}, {"term": "Prososial motivasjon", "module": "Motivasjon", "type": "Begrepp", "definition": "Motivation som bygger på en önskan att hjälpa eller göra något bra för andra eller organisationen.", "example": "En sjuksköterska tar extra tid med en patient eftersom hon vill hjälpa personen."}, {"term": "Utskyvningseffekten / crowding-out", "module": "Motivasjon", "type": "Teori", "definition": "När ett motivationssystem tränger undan ett annat. För mycket fokus på yttre belöningar kan exempelvis försvaga inre motivation.", "example": "En anställd som tidigare tyckte om att hjälpa kunder börjar fokusera nästan enbart på bonus per försäljning."}, {"term": "Adam Grants callsenterstudie", "module": "Motivasjon", "type": "Forskning", "definition": "Ett exempel på prosocial motivation: medarbetare som fick möta personer som hade haft nytta av deras arbete ökade sin insats och sina resultat. Meningen med arbetet blev tydligare.", "example": "En insamlare möter en student som fått stipendium tack vare arbetet och upplever därefter större mening med telefonsamtalen."}, {"term": "Hedonisme", "module": "Motivasjon", "type": "Begrepp", "definition": "Jobbrelaterat välbefinnande förstått som positiva känslor, glädje och behag.", "example": "Du känner dig glad och nöjd under arbetsdagen."}, {"term": "Eudaimonisme", "module": "Motivasjon", "type": "Begrepp", "definition": "Välbefinnande kopplat till mening, personlig utveckling och att använda sina förmågor.", "example": "Ett krävande projekt är inte alltid roligt, men du upplever att du växer och gör något meningsfullt."}, {"term": "Selvbestemmelsesteorien (SDT)", "module": "Motivasjon", "type": "Teori", "definition": "Deci och Ryan: motivation och välbefinnande stärks när tre grundläggande psykologiska behov tillfredsställs: autonomi, kompetens/mestring och tillhörighet/relasjoner.", "example": "En medarbetare får välja arbetsmetod, utvecklar sin kompetens och känner sig inkluderad i teamet."}, {"term": "Autonomi", "module": "Motivasjon", "type": "Begrepp", "definition": "Upplevelsen av självbestämmande och möjlighet att påverka hur man handlar eller arbetar.", "example": "Du får själv välja hur du ska lösa en arbetsuppgift."}, {"term": "Kompetanse / mestring", "module": "Motivasjon", "type": "Begrepp", "definition": "Behovet av att känna att man kan utvecklas och behärska uppgifter.", "example": "En ny uppgift är utmanande men du märker gradvis att du blir bättre på den."}, {"term": "Tilhørighet / relasjoner", "module": "Motivasjon", "type": "Begrepp", "definition": "Behovet av att känna social anknytning och tillhörighet till andra.", "example": "Du känner att kollegorna inkluderar dig och att du är en del av teamet."}, {"term": "Mestringsorientering", "module": "Motivasjon", "type": "Teori", "definition": "Målorientering där fokus ligger på lärande, utveckling och förbättring jämfört med den egna tidigare prestationen.", "example": "Du är nöjd med ett B eftersom du förbättrat dig från ett D och lärt dig mer."}, {"term": "Prestasjonsorientering", "module": "Motivasjon", "type": "Teori", "definition": "Målorientering där fokus ligger på att visa kompetens och prestera bättre än andra eller undvika att framstå som svag.", "example": "Du blir mest motiverad av att få högre betyg än resten av studiegruppen."}, {"term": "Growth mindset", "module": "Motivasjon", "type": "Begrepp", "definition": "Synen att förmågor kan utvecklas genom träning, strategier och lärande.", "example": "Efter ett dåligt resultat tänker du att du kan förbättra dig genom att ändra hur du tränar."}, {"term": "Fixed mindset", "module": "Motivasjon", "type": "Begrepp", "definition": "Synen att förmågor i hög grad är fasta och svåra att förändra.", "example": "Efter ett dåligt resultat tänker du 'jag är helt enkelt dålig på statistik'."}, {"term": "Mestringstro / self-efficacy", "module": "Motivasjon", "type": "Teori", "definition": "Banduras begrepp för individens bedömning av sin förmåga att klara en viss uppgift med de färdigheter man har.", "example": "Efter flera lyckade presentationer får du större tro på att du kan genomföra nästa presentation bra."}, {"term": "Psykologisk myndiggjøring", "module": "Motivasjon", "type": "Teori", "definition": "Ett tillstånd av ökad inre motivation med fyra delar: mening, kompetens, självbestämmande och påverkan.", "example": "En anställd upplever att jobbet är viktigt, känner sig kompetent, får fatta egna beslut och ser att arbetet påverkar resultatet."}, {"term": "Job crafting", "module": "Motivasjon", "type": "Strategi", "definition": "Att aktivt forma delar av sitt arbete så att jobbet passar bättre och upplevs mer meningsfullt eller motiverande.", "example": "En anställd som gillar kundkontakt tar initiativ till fler kundmöten och mindre administrativt arbete."}, {"term": "Jobbkarakteristikamodellen", "module": "Motivasjon", "type": "Teori", "definition": "Hackman och Oldham: fem centrala jobbkaraktäristika är varierad användning av färdigheter, uppgiftsidentitet, uppgiftsbetydelse, autonomi och återkoppling. De påverkar bland annat mening, ansvar och kunskap om resultat.", "example": "En person får följa ett helt projekt från början till slut, använda flera färdigheter, se nyttan, bestämma arbetsmetod och få feedback."}, {"term": "Krav-kontroll-modellen", "module": "Motivasjon", "type": "Teori", "definition": "Stress beror inte bara på hur höga kraven är utan också på hur mycket kontroll individen har. Höga krav och låg kontroll innebär särskilt stor belastningsrisk.", "example": "Två personer har lika mycket att göra, men den som själv kan prioritera och påverka arbetet upplever större kontroll."}, {"term": "Jobbkrav-ressursmodellen (JD-R)", "module": "Motivasjon", "type": "Teori", "definition": "Arbetet innehåller jobbkrav som kräver ansträngning och jobbresurser som hjälper oss att hantera kraven och nå mål. Höga krav med otillräckliga resurser kan ge stress och utmattning, medan resurser kan stärka motivation och prestation.", "example": "En konsult har hårda deadlines men får autonomi, stöd och tydlig feedback. Resurserna hjälper till att hantera kraven."}, {"term": "Arbeidsklima", "module": "Motivasjon", "type": "Begrepp", "definition": "Hur medarbetare uppfattar och tolkar arbetsmiljön i organisationen.", "example": "I ett team upplever de anställda att det är tryggt att säga vad de tycker, vilket skapar ett positivt röstklimat."}, {"term": "Mestringsklima", "module": "Motivasjon", "type": "Begrepp", "definition": "Ett motivationsklimat där lärande, samarbete, egen utveckling och förbättring står i centrum.", "example": "Chefen berömmer utveckling och lärande, inte bara vem som säljer mest."}, {"term": "Prestasjonsklima", "module": "Motivasjon", "type": "Begrepp", "definition": "Ett motivationsklimat där resultat, ranking och jämförelse mellan personer står i centrum.", "example": "Varje månad publiceras en lista över vem som sålt mest och bara vinnaren får bonus."}, {"term": "Prestasjonsledelse", "module": "Motivasjon", "type": "Begrepp", "definition": "Systematisk uppföljning av mål, prestation, utveckling och feedback.", "example": "Chef och medarbetare sätter mål, följer upp resultaten och diskuterar utveckling regelbundet."}, {"term": "Medarbeidersamtale", "module": "Motivasjon", "type": "Begrepp", "definition": "Samtal mellan ledare och medarbetare som kan användas för utveckling och/eller administrativa bedömningar.", "example": "Chef och anställd diskuterar mål, trivsel, utvecklingsbehov och prestation."}, {"term": "McGregors teori X", "module": "Motivasjon", "type": "Teori", "definition": "Antagandet att människor i grunden är ovilliga att arbeta och därför behöver styrning, kontroll och sanktioner.", "example": "Chefen övervakar allt arbete eftersom hen antar att personalen annars kommer att slappa."}, {"term": "McGregors teori Y", "module": "Motivasjon", "type": "Teori", "definition": "Antagandet att människor kan vara motiverade, ta ansvar och styra sig själva när förutsättningarna är rätt.", "example": "Chefen ger ansvar och autonomi eftersom hen tror att medarbetarna vill göra ett bra jobb."}, {"term": "Tillit", "module": "Motivasjon", "type": "Begrepp", "definition": "En förväntan om att andra kommer att agera på ett pålitligt och rimligt sätt. Övearket skiljer bland annat mellan identifikationsbaserad, kalkylerad och akut tillit.", "example": "En chef låter en erfaren medarbetare fatta beslut utan ständig kontroll eftersom det finns etablerad tillit."}, {"term": "Fordelingsrettferdighet", "module": "Motivasjon", "type": "Begrepp", "definition": "Upplevelsen av att fördelningen av resultat eller belöningar är rättvis.", "example": "Två personer som gjort samma arbete får likvärdig belöning."}, {"term": "Prosedyrerettferdighet", "module": "Motivasjon", "type": "Begrepp", "definition": "Upplevelsen av att processerna och reglerna bakom beslut är rättvisa.", "example": "Alla kandidater bedöms efter samma tydliga kriterier vid en befordran."}, {"term": "Interaksjonsrettferdighet", "module": "Motivasjon", "type": "Begrepp", "definition": "Upplevelsen av att bli behandlad med respekt, få rimliga förklaringar och bli bemött med omtanke.", "example": "En chef förklarar ett svårt beslut tydligt och lyssnar respektfullt på medarbetarens synpunkter."}, {"term": "Sosial bytteteori", "module": "Motivasjon", "type": "Teori", "definition": "Relationer kan bygga på frivilligt ömsesidigt utbyte där exakt återbetalning inte är bestämd på förhand.", "example": "En chef ger stöd utöver det formella, och medarbetaren svarar senare med extra engagemang."}, {"term": "LMX – Leader-Member Exchange", "module": "Motivasjon", "type": "Teori", "definition": "Ledare kan utveckla relationer av olika kvalitet med olika medarbetare. Hög LMX präglas mer av tillit och socialt utbyte, låg LMX mer av det formella arbetsutbytet.", "example": "En medarbetare har stort förtroende och nära dialog med chefen medan en annan relation nästan bara handlar om arbetsuppgifterna."}, {"term": "Psykologisk kontrakt", "module": "Motivasjon", "type": "Begrepp", "definition": "Oskrivna ömsesidiga förväntningar mellan arbetstagare och organisation utöver det formella anställningsavtalet.", "example": "Du förväntar dig utvecklingsmöjligheter eftersom arbetsgivaren signalerat det, trots att det inte står i kontraktet."}, {"term": "McClellands behovsteori", "module": "Motivasjon", "type": "Teori", "definition": "Motivation kan kopplas till behov av prestation, tillhörighet och makt. Maktbehov kan vara personligt eller socialiserat.", "example": "En ledare med starkt prestationsbehov söker svåra mål, medan en med starkt tillhörighetsbehov värderar goda relationer högt."}, {"term": "Destruktiv ledelse", "module": "Motivasjon", "type": "Begrepp", "definition": "Ledarbeteende som skadar organisationen, arbetsmiljön eller medarbetares trivsel och hälsa.", "example": "En chef förödmjukar medarbetare offentligt, skapar rädsla och favoriserar vissa personer."}, {"term": "Autoritær ledelse", "module": "Motivasjon", "type": "Ledelse", "definition": "Ledaren fattar beslut själv och ger tydliga order med liten medverkan från medarbetarna.", "example": "Chefen bestämmer både mål och arbetsmetod utan att fråga teamet."}, {"term": "Demokratisk ledelse", "module": "Motivasjon", "type": "Ledelse", "definition": "Ledaren involverar medarbetare i beslut och uppmuntrar delaktighet.", "example": "Teamet diskuterar tillsammans hur ett nytt arbetssätt ska införas."}, {"term": "La-det-skure-ledelse / laissez-faire", "module": "Motivasjon", "type": "Ledelse", "definition": "Passiv ledning där ledaren undviker ansvar eller ingripande när ledarskap behövs.", "example": "En konflikt eskalerar i teamet men chefen gör ingenting trots att problemet är känt."}, {"term": "Transformasjonsledelse", "module": "Motivasjon", "type": "Ledelse", "definition": "Ledarskap som bland annat försöker inspirera, utveckla och skapa mening kring gemensamma mål.", "example": "Chefen visar varför förändringen är viktig och får teamet att vilja bidra till visionen."}, {"term": "Transaksjonsledelse", "module": "Motivasjon", "type": "Ledelse", "definition": "Ledarskap som bygger mer på tydliga utbyten mellan prestation och belöning eller korrigering.", "example": "Säljaren får bonus när ett bestämt säljmål uppnås."}, {"term": "Stress", "module": "Stress", "type": "Begrepp", "definition": "Ett tillstånd som kan uppstå när individen upplever att omgivningens krav överstiger de resurser man upplever sig ha för att hantera situationen.", "example": "Du har tre deadlines samtidigt och upplever att tiden och energin inte räcker till."}, {"term": "Stressor", "module": "Stress", "type": "Begrepp", "definition": "En faktor eller händelse som kan utlösa en stressreaktion. Stressorer kan vara fysiska, psykologiska eller sociala.", "example": "Högt buller kan vara en fysisk stressor, tidspress en psykologisk och konflikt med chefen en social."}, {"term": "Teknostress", "module": "Stress", "type": "Begrepp", "definition": "Stress kopplad till användning och utveckling av informations- och kommunikationsteknik samt de krav tekniken skapar.", "example": "Nya system införs hela tiden och du måste ständigt lära om samtidigt som du ska arbeta snabbare."}, {"term": "Tekno-overbelastning", "module": "Stress", "type": "Begrepp", "definition": "Teknostress där tekniken skapar krav på att arbeta snabbare eller längre.", "example": "Nya digitala verktyg gör att chefen förväntar sig dubbelt så många ärenden per dag."}, {"term": "Tekno-invasjon", "module": "Stress", "type": "Begrepp", "definition": "När tekniken gör att arbetet tränger in i privatlivet och man förväntas vara tillgänglig.", "example": "Jobbnotiser och mejl kommer hela kvällen och du känner att du måste svara."}, {"term": "Tekno-kompleksitet", "module": "Stress", "type": "Begrepp", "definition": "När tekniken upplevs så komplex att den kräver mycket lärande och skapar känslan av att den egna kompetensen inte räcker.", "example": "Ett nytt avancerat IT-system införs och du känner att du aldrig hinner lära dig det ordentligt."}, {"term": "Tekno-usikkerhet", "module": "Stress", "type": "Begrepp", "definition": "Osäkerhet kopplad till teknologi, exempelvis rädsla för att tekniken ska förändra eller ersätta den egna rollen.", "example": "En anställd oroar sig för att automatisering ska göra jobbet överflödigt."}, {"term": "GAS – General Adaptation Syndrome", "module": "Stress", "type": "Teori", "definition": "Hans Selyes modell för kroppens stressreaktion i tre faser: alarmfas, motståndsfas och utmattningsfas.", "example": "Först reagerar kroppen kraftigt på en deadline, därefter håller du ut under belastningen, men långvarig belastning utan återhämtning kan till slut ge utmattning."}, {"term": "Stimulusperspektivet på stress", "module": "Stress", "type": "Perspektiv", "definition": "Ser stress främst utifrån yttre händelser och belastningar, alltså stressorer i miljön.", "example": "Man undersöker exempelvis om hög arbetsbelastning och konflikter på jobbet skapar stress."}, {"term": "Transaksjonsperspektivet", "module": "Stress", "type": "Teori", "definition": "Lazarus och Folkman: stress uppstår i samspelet mellan person och miljö och påverkas av hur situationen bedöms. Primär bedömning gäller vad situationen betyder, sekundär vilka resurser man har, följt av ny bedömning.", "example": "Två personer får samma presentation. Den ena ser den som ett hot, den andra som en utmaning."}, {"term": "CATS – Cognitive Activation Theory of Stress", "module": "Stress", "type": "Teori", "definition": "Stressaktivering är i sig en normal respons. Hur stimuli och alarmreaktionen uppfattas, exempelvis som hot eller utmaning, är centralt för hur belastande situationen blir.", "example": "Hög puls före en presentation kan tolkas som 'jag kommer misslyckas' eller som att kroppen gör sig redo."}, {"term": "Biopsykososial modell", "module": "Stress", "type": "Teori", "definition": "Stress och hälsa förstås genom samspelet mellan biologiska, psykologiska och sociala faktorer.", "example": "Samma arbetskrav kan påverka två personer olika beroende på kroppsliga förutsättningar, tolkning och socialt stöd."}, {"term": "Rolleuklarhet", "module": "Stress", "type": "Begrepp", "definition": "När förväntningar, mål, ansvar eller arbetsuppgifter är otydliga.", "example": "Du får ansvar för ett projekt men ingen kan förklara vad du faktiskt får besluta om."}, {"term": "Kvantitativ jobbusikkerhet", "module": "Stress", "type": "Begrepp", "definition": "Oro för att förlora själva anställningen eller bli arbetslös.", "example": "Företaget ska säga upp personal och du är rädd att ditt jobb försvinner."}, {"term": "Kvalitativ jobbusikkerhet", "module": "Stress", "type": "Begrepp", "definition": "Oro för att förlora viktiga egenskaper eller fördelar i jobbet, exempelvis karriärmöjligheter eller intressanta arbetsuppgifter.", "example": "Du behåller jobbet men oroar dig för att omorganisationen tar bort ditt ansvar och dina utvecklingsmöjligheter."}, {"term": "Employability", "module": "Stress", "type": "Begrepp", "definition": "Kompetenser, kunskaper och egenskaper som gör en person attraktiv på arbetsmarknaden och bättre rustad att anpassa sig.", "example": "En person med eftertraktad kompetens kan känna mindre oro vid omorganisation eftersom andra jobb känns möjliga."}, {"term": "Fleksibilitet", "module": "Stress", "type": "Begrepp", "definition": "Förmåga hos individ eller organisation att anpassa sig till förändrade krav och förutsättningar.", "example": "Ett team ändrar snabbt arbetssätt när ett nytt digitalt system införs."}, {"term": "HR-perspektiv", "module": "Stress", "type": "Perspektiv", "definition": "Människor ses som en central resurs som organisationen behöver utveckla, motivera och ta hand om.", "example": "Företaget investerar i kompetensutveckling och arbetsmiljö eftersom medarbetarna är avgörande för resultaten."}, {"term": "Utbrenthet", "module": "Stress", "type": "Begrepp", "definition": "Ett tillstånd av fysisk, emotionell och mental utmattning som kan utvecklas efter långvarig belastning och stress.", "example": "Efter månader av hög arbetsbelastning känner en medarbetare sig helt tömd och distanserad från arbetet."}, {"term": "Emosjonell utmattelse", "module": "Stress", "type": "Begrepp", "definition": "Den del av utbrändhet som handlar om att känna sig emotionellt tömd på energi.", "example": "Efter arbetsdagen känner du att du inte har någon mental energi kvar till någonting annat."}, {"term": "Depersonalisering / kynisme", "module": "Stress", "type": "Begrepp", "definition": "En del av utbrändhet där personen utvecklar en kall, distanserad eller cynisk hållning till dem man arbetar med.", "example": "En vårdanställd börjar tala om patienter som störningsmoment snarare än människor som behöver hjälp."}, {"term": "Redusert personlig mestring", "module": "Stress", "type": "Begrepp", "definition": "En del av utbrändhet där personen upplever minskad kompetens, effektivitet eller känsla av att lyckas i arbetet.", "example": "Trots tidigare goda resultat känner medarbetaren att hen inte längre klarar sitt jobb."}, {"term": "Arbeidsnarkomani", "module": "Stress", "type": "Begrepp", "definition": "Ett starkt och svårt kontrollerbart behov av att arbeta, där personen har svårt att koppla bort jobbet.", "example": "En person arbetar sent varje kväll och känner skuld när hen försöker vara ledig."}, {"term": "Spillover", "module": "Stress", "type": "Begrepp", "definition": "När upplevelser i en livssfär överförs till en annan inom samma person, exempelvis från arbete till privatliv.", "example": "Du kommer hem stressad från jobbet och kan inte sluta tänka på morgondagens deadline."}, {"term": "Crossover", "module": "Stress", "type": "Begrepp", "definition": "När stress eller andra upplevelser överförs mellan personer.", "example": "Din arbetsstress gör dig irriterad hemma och din partner börjar också känna stress."}, {"term": "Forebygging av stress", "module": "Stress", "type": "Strategi", "definition": "Stress kan förebyggas både genom att minska eller organisera krav bättre och genom att stärka resurser som kontroll, stöd, återhämtning och tydlighet.", "example": "Organisationen minskar orimliga deadlines samtidigt som chefen ger mer stöd och autonomi."}];
let grades=JSON.parse(localStorage.getItem('sms-grades')||'{}'), deck=[], idx=0;
const $=id=>document.getElementById(id);
const types=[...new Set(all.map(x=>x.type))].sort(); types.forEach(x=>$('type').insertAdjacentHTML('beforeend',`<option>${x}</option>`));
function apply(){
 const q=$('search').value.toLowerCase(), m=$('module').value,t=$('type').value,s=$('status').value;
 deck=all.filter(x=>(!q||(x.term+' '+x.definition+' '+x.example).toLowerCase().includes(q))&&(!m||x.module===m)&&(!t||x.type===t)&&(!s||(s==='unrated'?!grades[x.term]:grades[x.term]===s)));
 idx=Math.min(idx,Math.max(0,deck.length-1)); render(); renderGrid(); stats();
}
function render(){
 if(!deck.length){$('term').textContent='Inga kort matchar filtret';$('definition').textContent='Ändra sökning eller filter.';$('example').textContent='';$('position').textContent='0 / 0';return}
 const x=deck[idx]; $('card').classList.remove('flipped'); $('term').textContent=x.term;$('definition').textContent=x.definition;$('example').textContent=x.example;
 $('frontTag').textContent=x.module+' · '+x.type;$('backTag').textContent=x.module+' · '+x.type;
 $('position').textContent=(idx+1)+' / '+deck.length; $('bar').style.width=((idx+1)/deck.length*100)+'%';
}
function renderGrid(){
 $('grid').innerHTML=deck.map((x,i)=>`<div class="mini" data-i="${i}"><small>${x.module} · ${x.type}</small><strong>${x.term}</strong><small>${grades[x.term]?({known:'✓ Kan',uncertain:'~ Osäker',unknown:'× Kan inte'}[grades[x.term]]):'Ej testad'}</small></div>`).join('');
 document.querySelectorAll('.mini').forEach(el=>el.onclick=()=>{idx=+el.dataset.i;render();scrollTo({top:150,behavior:'smooth'})})
}
function stats(){
 $('count').textContent=all.length+' flashcards';
 const c=k=>Object.values(grades).filter(v=>v===k).length;
 $('known').textContent='✓ '+c('known')+' kan'; $('uncertain').textContent='~ '+c('uncertain')+' osäkra'; $('unknown').textContent='× '+c('unknown')+' kan inte';
}
$('card').onclick=()=>$('card').classList.toggle('flipped'); $('flip').onclick=()=>$('card').classList.toggle('flipped');
$('next').onclick=()=>{if(deck.length){idx=(idx+1)%deck.length;render()}};
$('shuffle').onclick=()=>{deck.sort(()=>Math.random()-.5);idx=0;render();renderGrid()};
document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{if(!deck.length)return;grades[deck[idx].term]=b.dataset.grade;localStorage.setItem('sms-grades',JSON.stringify(grades));stats();renderGrid();idx=(idx+1)%deck.length;render()});
['search','module','type','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{idx=0;apply()}));
apply();
</script>
</body></html>
